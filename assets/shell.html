<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vulcan</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      height: 100vh;
      overflow: hidden;
      background: #111;
      color: #e0e0e0;
    }

    .container {
      display: flex;
      height: 100vh;
    }

    /* ─── Sidebar ─────────────────────────────────────── */
    .sidebar {
      width: 48px;
      min-width: 48px;
      background: #111;
      border-right: 1px solid #222;
      display: flex;
      flex-direction: column;
      transition: width 0.25s cubic-bezier(0.4, 0, 0.2, 1),
                  min-width 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
      position: relative;
      z-index: 10;
    }

    .sidebar:hover,
    .sidebar.pinned {
      width: 260px;
      min-width: 260px;
    }

    /* Logo area */
    .sidebar-header {
      height: 48px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      border-bottom: 1px solid #1a1a1a;
      flex-shrink: 0;
      gap: 10px;
      overflow: hidden;
      white-space: nowrap;
    }

    .logo-icon {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-icon svg {
      width: 20px;
      height: 20px;
    }

    .logo-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      font-weight: 500;
      color: #eee;
      opacity: 0;
      transition: opacity 0.15s 0.1s;
      letter-spacing: -0.3px;
    }

    .sidebar:hover .logo-text,
    .sidebar.pinned .logo-text {
      opacity: 1;
    }

    /* Status area */
    .status-section {
      padding: 0 12px;
      height: 40px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid #1a1a1a;
      flex-shrink: 0;
      gap: 8px;
      overflow: hidden;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      flex-shrink: 0;
      box-shadow: 0 0 6px rgba(34, 197, 94, 0.4);
    }

    .status-dot.offline {
      background: #ef4444;
      box-shadow: 0 0 6px rgba(239, 68, 68, 0.4);
    }

    .status-text {
      font-size: 11px;
      color: #666;
      opacity: 0;
      transition: opacity 0.15s 0.1s;
      white-space: nowrap;
    }

    .sidebar:hover .status-text,
    .sidebar.pinned .status-text {
      opacity: 1;
    }

    .status-text span {
      color: #888;
      margin-left: 8px;
    }

    /* Views section */
    .views-section {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 8px 0;
    }

    .views-label {
      padding: 8px 14px 6px;
      font-size: 10px;
      font-weight: 600;
      color: #444;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      opacity: 0;
      transition: opacity 0.15s 0.1s;
      white-space: nowrap;
    }

    .sidebar:hover .views-label,
    .sidebar.pinned .views-label {
      opacity: 1;
    }

    .view-item {
      height: 34px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      cursor: pointer;
      transition: background 0.12s;
      gap: 10px;
      overflow: hidden;
      white-space: nowrap;
      position: relative;
    }

    .view-item::before {
      content: '';
      position: absolute;
      left: 0;
      top: 6px;
      bottom: 6px;
      width: 2px;
      background: transparent;
      border-radius: 1px;
      transition: background 0.12s;
    }

    .view-item:hover {
      background: #1a1a1a;
    }

    .view-item.active {
      background: #1a1a1a;
    }

    .view-item.active::before {
      background: #fff;
    }

    .view-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #444;
      flex-shrink: 0;
      transition: background 0.12s;
    }

    .view-item.active .view-dot {
      background: #fff;
    }

    .view-item:hover .view-dot {
      background: #888;
    }

    .view-name {
      font-size: 12px;
      color: #777;
      transition: color 0.12s, opacity 0.15s 0.1s;
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: 0;
    }

    .sidebar:hover .view-name,
    .sidebar.pinned .view-name {
      opacity: 1;
    }

    .view-item:hover .view-name {
      color: #ccc;
    }

    .view-item.active .view-name {
      color: #eee;
    }

    .empty-views {
      padding: 20px 14px;
      text-align: center;
      opacity: 0;
      transition: opacity 0.15s 0.1s;
    }

    .sidebar:hover .empty-views,
    .sidebar.pinned .empty-views {
      opacity: 1;
    }

    .empty-views-text {
      font-size: 11px;
      color: #333;
      line-height: 1.5;
    }

    /* Footer */
    .sidebar-footer {
      padding: 8px 12px;
      border-top: 1px solid #1a1a1a;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      height: 40px;
      gap: 8px;
      overflow: hidden;
    }

    .footer-icon {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #444;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.12s;
    }

    .footer-icon:hover {
      color: #888;
      background: #1a1a1a;
    }

    .footer-text {
      font-size: 10px;
      color: #333;
      opacity: 0;
      transition: opacity 0.15s 0.1s;
      white-space: nowrap;
      font-family: 'JetBrains Mono', monospace;
    }

    .sidebar:hover .footer-text,
    .sidebar.pinned .footer-text {
      opacity: 1;
    }

    /* ─── Content Area ────────────────────────────────── */
    .content {
      flex: 1;
      position: relative;
      background: #111;
    }

    .content iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #111;
    }

    .welcome-screen {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    .welcome-logo {
      opacity: 0.08;
      margin-bottom: 20px;
    }

    .welcome-text {
      font-size: 14px;
      color: #333;
      font-weight: 400;
    }

    /* Scrollbar */
    .views-section::-webkit-scrollbar { width: 3px; }
    .views-section::-webkit-scrollbar-track { background: transparent; }
    .views-section::-webkit-scrollbar-thumb { background: #222; border-radius: 3px; }
    .views-section::-webkit-scrollbar-thumb:hover { background: #444; }
  </style>
</head>
<body>
  <div class="container">

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:#eee">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
          </svg>
        </div>
        <span class="logo-text">vulcan</span>
      </div>

      <div class="status-section">
        <div class="status-dot" id="statusDot"></div>
        <div class="status-text">
          <span id="uptime">00:00</span>
        </div>
      </div>

      <div class="views-section" id="viewsSection">
        <div class="views-label">Views</div>
        <div id="viewsList">
          <div class="empty-views">
            <div class="empty-views-text">no views yet</div>
          </div>
        </div>
      </div>

      <div class="sidebar-footer">
        <div class="footer-icon" title="Settings" onclick="window.open('/api/health','_blank')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
          </svg>
        </div>
        <span class="footer-text">v0.1.0</span>
      </div>
    </div>

    <!-- Content Area -->
    <div class="content">
      <iframe id="contentFrame" src=""></iframe>
      <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-logo">
          <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
          </svg>
        </div>
        <div class="welcome-text">deploy a view to get started</div>
      </div>
    </div>

  </div>

  <script>
    const frame = document.getElementById('contentFrame');
    const welcomeScreen = document.getElementById('welcomeScreen');
    const viewsList = document.getElementById('viewsList');
    const uptimeEl = document.getElementById('uptime');

    let currentView = null;
    let startTime = Date.now();

    function formatUptime(ms) {
      const s = Math.floor(ms / 1000);
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      if (h > 0) return h + 'h' + String(m).padStart(2,'0');
      return String(m).padStart(2,'0') + ':' + String(s % 60).padStart(2,'0');
    }

    setInterval(() => {
      uptimeEl.textContent = formatUptime(Date.now() - startTime);
    }, 1000);

    async function loadViews() {
      try {
        const res = await fetch('/api/view/list');
        const data = await res.json();
        const views = data.views.filter(v => v.name !== 'index');

        if (views.length === 0) {
          viewsList.innerHTML = '<div class="empty-views"><div class="empty-views-text">no views yet</div></div>';
          return;
        }

        viewsList.innerHTML = views.map(v =>
          '<div class="view-item ' + (currentView === v.name ? 'active' : '') + '" data-view="' + v.name + '">' +
            '<div class="view-dot"></div>' +
            '<span class="view-name">' + v.name + '</span>' +
          '</div>'
        ).join('');

        viewsList.querySelectorAll('.view-item').forEach(el => {
          el.addEventListener('click', () => loadView(el.dataset.view));
        });

        if (!currentView && views.length > 0) {
          loadView(views[0].name);
        }
      } catch (err) {
        console.error('Failed to load views:', err);
      }
    }

    function loadView(name) {
      currentView = name;
      frame.src = '/view/' + name + '.html';
      welcomeScreen.style.display = 'none';

      viewsList.querySelectorAll('.view-item').forEach(el => {
        el.classList.toggle('active', el.dataset.view === name);
      });

      window.location.hash = name;
    }

    window.addEventListener('message', (e) => {
      if (e.data.type === 'vulcan:refresh') {
        loadViews();
      } else if (e.data.type === 'vulcan:view-deployed') {
        loadViews().then(() => {
          if (e.data.name) loadView(e.data.name);
        });
      }
    });

    if (window.location.hash) {
      loadView(window.location.hash.slice(1));
    }

    loadViews();
    setInterval(loadViews, 2000);
  </script>
</body>
</html>
